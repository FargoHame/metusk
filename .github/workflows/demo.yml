name: Render demo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - demo/metusk.tape

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Metusk and optional dependencies
        run: uv sync --all-extras

      - name: Render demo/metusk.gif
        uses: charmbracelet/vhs-action@v2
        with:
          path: demo/metusk.tape

      - name: Upload rendered demo
        uses: actions/upload-artifact@v4
        with:
          name: metusk-demo
          path: demo/metusk.gif
          if-no-files-found: error

      - name: Commit changed GIF
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- demo/metusk.gif)" ]]; then
            echo "demo/metusk.gif is unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- demo/metusk.gif
          git commit -m "docs: update Metusk demo GIF"
          git push origin "HEAD:${GITHUB_REF_NAME}"
